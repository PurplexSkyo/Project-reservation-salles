<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signy Salles</title>
    <link rel="stylesheet" href="css/Reservation.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class ="header">
        <div class="container">
            <div class="logo_txt">
                <span class ="title">Signy <span class="blue">Salles</span></span>
                <span class="desc">Site de reservation de salles bureautiques et jeux </span>
            </div>
            
            <nav class="nav-links">
                <a href="#">Accueil</a>
                <a href="#">Salles</a>
                <a href="#">Reservation</a>
            </nav>
        </div>
    </header>
    <main>
    <div class="page">
    <a href="#" class="return"> ⇦ Retour aux Salle</a>
     <h1 class="page-title">Réserver une salle</h1>
     <p class="page-subtitle">Remplissez le formulaire pour réserver votre espace</p>
 
        <div class="card">
    
        
        <div class="card-header">
            <span class="card-header-title">Informations de réservation</span>
        </div>
    
    
        <form action="#" method="POST">
    
        
            <div class="form-row">
            <div class="form-group">
                <label for="nom">Nom *</label>
                <input type="text" id="nom" name="nom" placeholder="Votre nom" required />
            </div>
            <div class="form-group">
                <label for="prenom">Prénom *</label>
                <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required />
            </div>
            </div>
    
            <!-- Email -->
            <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="votre@email.com" required />
            </div>
    
            <!-- Salle -->
            <div class="form-group">
            <label for="salle">Salle *</label>
            <div class="select-wrap">
                <select id="salle" name="salle" required>
                <option value="haussmann">Salle Haussmann — 12 pers. — 45€/h</option>
                <option value="rivoli">Salle Rivoli — 8 pers. — 35€/h</option>
                <option value="vendome">Salle Vendôme — 20 pers. — 65€/h</option>
                </select>
            </div>
            </div>
    
            <!-- Date + Créneau -->
            <div class="form-row">
            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date" required />
            </div>
            <div class="form-group">
                <label for="creneau">Créneau *</label>
                <div class="select-wrap">
                <select id="creneau" name="creneau" required>
                    <option value="" disabled selected>Choisir un créneau</option>
                    <option value="9h-10h">09h00 -- 11h05</option>
                    <option value="10h-11h">11h15 -- 13h05</option>
                    <option value="11h-12h">13h15 -- 15h05</option>
                    <option value="14h-15h">15h15 -- 17h05</option>
                    <option value="15h-16h">17h15 -- 19h05</option>
                </select>
                </div>
            </div>
            </div>
    
            <!-- Nombre de personnes -->
            <div class="form-group">
            <label for="personnes">Nombre de personnes *</label>
            <div class="input-icon-wrap">
                <input type="number" id="personnes" name="personnes"
                    placeholder="Ex: 5" min="1" max="50" required />
            </div>
            </div>
    
            <!-- Bouton -->
            <button type="submit" class="btn-confirm">Confirmer la réservation</button>
    
        </form>
        </div>
  </div>
    </main>
    <footer>
        <p class = "copyright "> © 2026 Signy Salles — Tous droits réservés</p>
    </footer>
</body>
</html>
